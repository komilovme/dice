# Production-leaning Compose stack for the Telegram Dice Game Bot.
# For local development copy .env.example to .env first.
#
#   docker compose up -d --build
#
# The `bot` service runs migrations on startup and then the bot (long-polling
# by default; set WEBHOOK_URL in .env to switch to webhook mode).

name: dice-game-bot

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dicebot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dicebot}
      POSTGRES_DB: ${POSTGRES_DB:-dicebot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dicebot} -d ${POSTGRES_DB:-dicebot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Tuned for tens of thousands of users; adjust to your hardware.
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=512MB"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--maxmemory"
      - "512mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      RUN_SCHEDULER: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Expose the webhook port only if running in webhook mode.
    ports:
      - "${WEBAPP_PORT:-8080}:8080"

  # Optional: dedicated scheduler/worker. To scale the bot horizontally, run
  # multiple `bot` replicas with RUN_SCHEDULER=false and a single `worker`.
  # worker:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   restart: unless-stopped
  #   env_file: .env
  #   environment:
  #     POSTGRES_HOST: postgres
  #     REDIS_HOST: redis
  #     RUN_SCHEDULER: "true"
  #   command: ["worker"]
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy

volumes:
  pgdata:
  redisdata:
